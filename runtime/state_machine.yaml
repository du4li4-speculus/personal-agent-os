states:
  CREATED:
    next:
      - IDENTIFY_TASK
      - FAILED

  IDENTIFY_TASK:
    next:
      - FIND_SKILL
      - FAILED

  FIND_SKILL:
    gate: skill_registry
    next:
      - LOAD_SKILL
      - FAILED

  LOAD_SKILL:
    gate: skill_definition
    next:
      - RUNTIME_CHECK
      - FAILED

  RUNTIME_CHECK:
    next:
      - EXECUTE
      - RECOVERY
      - FAILED

  RECOVERY:
    next:
      - RUNTIME_CHECK
      - FAILED

  EXECUTE:
    requires:
      - execution_trace
    next:
      - ARTIFACT
      - FAILED

  ARTIFACT:
    gate: artifact_validation
    next:
      - VALIDATE
      - FAILED

  VALIDATE:
    next:
      - DELIVER
      - FAILED

  DELIVER:
    final: true

  FAILED:
    final: true
