schema_version: "1.0"
name: toefl-writing-grader
version: "2.0.0"
kind: workflow
# Development-only target contract. The absent entrypoint is intentional until
# every gate in docs/TOEFL_SKILL_ACTIVATION_CRITERIA.md actually passes.
inputs:
  contract: schemas/source_bundle.schema.json
  accepted_formats: [text, image, screenshot, pdf, document, pages]
intermediate_outputs:
  - name: source_bundle
    path: work/source_bundle.json
    schema: schemas/source_bundle.schema.json
  - name: evidence
    path: work/evidence.json
    schema: schemas/evidence.schema.json
outputs:
  # Target outputs are declarations, not claims of current implementation.
  - name: assessment
    path: artifacts/assessment.json
    schema: schemas/assessment.schema.json
  - name: diagnosis
    path: artifacts/diagnosis.json
    schema: schemas/diagnostic.schema.json
  - name: learning_loop
    path: artifacts/learning_loop.json
    schema: schemas/learning_loop.schema.json
  - name: student_report
    path: artifacts/student_report.pdf
  - name: parent_report
    path: artifacts/parent_report.pdf
  - name: teacher_dashboard
    path: artifacts/teacher_dashboard.json
capabilities:
  required: [runtime.execution_proof, runtime.schema_validation]
  optional: [document.extract_text, image.transcribe, pages.snappy, cognition.execute]
cognition:
  mode: optional
  prepare: [expansion, decision]
  critique: [critique]
  memory_review: memory
