name: multi_format_input
version: 1
purpose: >-
  Regression contract for the input-adapter and evidence boundary. Every case
  must produce source_bundle.json first and evidence.json second; none may
  produce an assessment score as part of extraction.

cases:
  - id: plain_text_response
    input: {format: text, role: response}
    adapter: input_adapters.text_adapter.TextAdapter
    expected:
      source_kind: text
      evidence_type: response_text
      assessment_ready_requires_prompt: true

  - id: screenshot_prompt
    input: {format: png, role: prompt}
    adapter: input_adapters.image_adapter.ImageAdapter
    expected:
      source_kind: image
      extraction_status: pending_ocr
      evidence_type: image_reference
      assessment_blocked_until: ocr_or_visual_transcription

  - id: pdf_document
    input: {format: pdf, role: response}
    adapter: input_adapters.text_adapter.TextAdapter
    expected:
      source_kind: document
      accepted_statuses: [complete, pending]
      evidence_must_preserve_gap: true

  - id: docx_document
    input: {format: docx, role: response}
    adapter: input_adapters.text_adapter.TextAdapter
    expected:
      source_kind: document
      extraction_method: docx-document-xml
      evidence_type: response_text

  - id: pages_with_embedded_images
    input: {format: pages, role: response}
    adapter: input_adapters.pages_adapter.PagesAdapter
    expected:
      source_kind: pages
      document_iwa_checked_at_start: true
      embedded_images_preserved: true
      annotation_empty_is_not_proof_of_absence: true

invariants:
  - source_bundle_has_sha256_and_adapter_provenance
  - evidence_items_have_source_ids
  - evidence_text_is_not_completed_by_inference
  - prompt_and_response_roles_are_explicit
  - no_score_fields_are_created_by_adapters_or_extractor
