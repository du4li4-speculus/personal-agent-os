name: Agent OS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate machine contracts
        run: python3 -m runtime.cli validate-contracts

      - name: Validate architecture boundaries
        run: python3 -m unittest tests.test_architecture_boundaries -v

      - name: Run full unit test suite
        run: python3 -m unittest discover -s tests -v

      - name: Check whitespace errors
        run: git diff --check
